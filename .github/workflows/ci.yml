name: Billmesh CI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Static validation
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Unit tests
        run: TEST_SUITE_NAME='Unit tests' ./scripts/test-output.sh go test -v -race -coverprofile=coverage.out ./internal/... ./tests/unit/...
      - name: Integration and E2E
        run: docker compose -f deploy/compose.test.yml -p billmesh-ci up --build --exit-code-from e2e e2e
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/compose.test.yml -p billmesh-ci logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose -f deploy/compose.test.yml -p billmesh-ci down -v --remove-orphans
