services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_USER: billmesh
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testpassword}
      POSTGRES_DB: billmesh
    ports:
      - "5433:5432"
    volumes:
      - billmesh-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billmesh -d billmesh"]
      interval: 2s
      timeout: 3s
      retries: 15

  mock-external:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: tester
    command: ["go", "run", "./tests/fakeserver"]
    environment:
      HTTP_ADDR: ":8090"
    ports:
      - "8090:8090"

volumes:
  billmesh-dev-postgres:
