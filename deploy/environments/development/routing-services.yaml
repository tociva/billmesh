apiVersion: v1
kind: Service
metadata:
  name: billmesh-api
  namespace: billmesh-development
  labels:
    app.kubernetes.io/name: billmesh-api
    app.kubernetes.io/instance: billmesh-api
    app.kubernetes.io/component: api
    app.kubernetes.io/managed-by: cluster-administrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billmesh-api
    app.kubernetes.io/instance: billmesh-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: billmesh-api-worker-metrics
  namespace: billmesh-development
  labels:
    app.kubernetes.io/name: billmesh-api
    app.kubernetes.io/instance: billmesh-api
    app.kubernetes.io/component: worker
    app.kubernetes.io/managed-by: cluster-administrator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: billmesh-api
    app.kubernetes.io/instance: billmesh-api
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
