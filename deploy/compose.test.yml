x-runtime-build: &runtime-build
  context: ..
  dockerfile: deploy/Dockerfile
  target: runtime
x-test-build: &test-build
  context: ..
  dockerfile: deploy/Dockerfile
  target: tester

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_USER: billmesh
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: billmesh_e2e
    volumes:
      - ./test-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billmesh -d billmesh_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15

  mock-external:
    build: *test-build
    command: ["go", "run", "./tests/fakeserver"]
    environment:
      HTTP_ADDR: ":8090"

  migrate:
    build: *runtime-build
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://billmesh:testpassword@postgres:5432/billmesh_e2e?sslmode=disable&search_path=billmesh
    depends_on:
      postgres:
        condition: service_healthy

  runtime-grants:
    image: postgres:17.6-alpine3.22
    entrypoint: ["psql", "-h", "postgres", "-U", "billmesh", "-d", "billmesh_e2e", "-v", "ON_ERROR_STOP=1", "-f", "/scripts/test-runtime-grants.sql"]
    environment:
      PGPASSWORD: testpassword
    volumes:
      - ./test-runtime-grants.sql:/scripts/test-runtime-grants.sql:ro
      - ./runtime-grants.sql:/scripts/runtime-grants.sql:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: *runtime-build
    command: ["api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://billmesh_runtime:runtimepassword@postgres:5432/billmesh_e2e?sslmode=disable&search_path=billmesh
      OIDC_ISSUER: http://mock-external:8090
      OIDC_AUDIENCE: billmesh-test
      JWKS_URL: http://mock-external:8090/.well-known/jwks.json
      BFF_ENABLED: "true"
      BFF_ALLOW_INSECURE_HTTP: "true"
      BFF_APP_ORIGIN: http://api:8080
      BFF_ISSUER: http://mock-external:8090
      BFF_CLIENT_ID: billmesh-web-test
      BFF_CLIENT_SECRET: test-secret
      BFF_AUDIENCE: billmesh-test
      BFF_REDIRECT_URI: http://api:8080/auth/callback
      BFF_POST_LOGOUT_REDIRECT_URI: http://api:8080/auth/logout/callback
      BFF_SESSION_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      BFF_RETURN_PATH_PREFIXES: /app
      RAZORPAY_BASE_URL: http://mock-external:8090
      RAZORPAY_WEBHOOK_SECRET: test-webhook-secret
      WEBHOOK_ALLOWED_PRIVATE_HOSTS: mock-external
      AUTH_FAILURES_PER_MINUTE: "1000"
      MUTATION_BURST: "500"
    depends_on:
      runtime-grants:
        condition: service_completed_successfully
      mock-external:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/billmesh", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

  worker:
    build: *runtime-build
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://billmesh_runtime:runtimepassword@postgres:5432/billmesh_e2e?sslmode=disable&search_path=billmesh
      WORKER_INTERVAL: 1s
      WEBHOOK_ALLOWED_PRIVATE_HOSTS: mock-external
    depends_on:
      runtime-grants:
        condition: service_completed_successfully

  e2e:
    build: *test-build
    environment:
      BILLMESH_BASE_URL: http://api:8080
      MOCK_SERVER_URL: http://mock-external:8090
      DATABASE_URL: postgres://billmesh:testpassword@postgres:5432/billmesh_integration?sslmode=disable&search_path=billmesh
      BILLMESH_E2E_DATABASE_URL: postgres://billmesh:testpassword@postgres:5432/billmesh_e2e?sslmode=disable&search_path=billmesh
      BILLMESH_RUNTIME_DATABASE_URL: postgres://billmesh_runtime:runtimepassword@postgres:5432/billmesh_e2e?sslmode=disable&search_path=billmesh
      BILLMESH_RESTORE_DATABASE_URL: postgres://billmesh:testpassword@postgres:5432/billmesh_restore?sslmode=disable&search_path=billmesh
      BILLMESH_ROUTE_TRACE_FILE: /tmp/billmesh-route-trace.ndjson
    command:
      - sh
      - -ec
      - |
        go run ./cmd/billmesh migrate up
        DATABASE_URL="$$BILLMESH_RESTORE_DATABASE_URL" go run ./cmd/billmesh migrate up
        TEST_SUITE_NAME='Foundation integration tests' ./scripts/test-output.sh go test -p=1 -v -race -count=1 -tags=integration ./tests/integration/foundation
        TEST_SUITE_NAME='Remaining integration tests' ./scripts/test-output.sh go test -p=1 -v -race -count=1 -tags=integration -skip '^TestFND011' ./tests/integration/...
        rm -f "$$BILLMESH_ROUTE_TRACE_FILE"
        TEST_SUITE_NAME='End-to-end tests' ./scripts/test-output.sh go test -p=1 -v -count=1 -tags=e2e ./tests/e2e/...
        go run ./scripts/verify-route-coverage.go "$$BILLMESH_ROUTE_TRACE_FILE"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

  performance:
    build: *test-build
    environment:
      BILLMESH_BASE_URL: http://api:8080
      MOCK_SERVER_URL: http://mock-external:8090
      DATABASE_URL: postgres://billmesh:testpassword@postgres:5432/billmesh_e2e?sslmode=disable&search_path=billmesh
      TEST_SUITE_NAME: Performance tests
    command: ["./scripts/test-output.sh", "go", "test", "-v", "-tags=performance", "-run", "^$$", "-bench=.", "-benchtime=10x", "./tests/performance/..."]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
