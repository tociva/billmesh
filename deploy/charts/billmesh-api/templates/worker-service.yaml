apiVersion: v1
kind: Service
metadata:
  name: {{ include "billmesh-api.fullname" . }}-worker-metrics
  labels:
    {{- include "billmesh-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "billmesh-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
