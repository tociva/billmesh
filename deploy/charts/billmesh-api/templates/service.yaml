{{- if .Values.service.create }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "billmesh-api.fullname" . }}
  labels:
    {{- include "billmesh-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "billmesh-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
