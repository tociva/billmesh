openapi: 3.1.0
info:
  title: Billmesh API
  version: 1.0.0
  description: |
    Billing, subscriptions, credit wallets, metering, payments, and webhook APIs.

    Service clients call `/v1/*` with a bearer token. When the browser BFF is
    enabled, the same protected operations are available below `/api/v1/*`
    with a realm-specific opaque cookie. Unsafe BFF requests additionally
    require the `X-CSRF-Token` returned by that realm's session endpoint.
servers:
  - url: /
    description: Current Billmesh server
tags:
  - name: Health
  - name: Browser authentication
  - name: Accounts
  - name: Catalogue
  - name: Subscriptions
  - name: Billing state
  - name: Entitlements
  - name: Wallets
  - name: Reservations
  - name: Installations
  - name: Usage
  - name: Payments
  - name: Webhooks
  - name: Administration
  - name: Events
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check whether the API process is running
      security: []
      responses:
        "200": { $ref: "#/components/responses/Health" }
  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check API and database readiness
      security: []
      responses:
        "200": { $ref: "#/components/responses/Readiness" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/auth/console/login:
    get:
      operationId: startConsoleBrowserLogin
      tags: [Browser authentication]
      summary: Start the browser OIDC authorization-code flow
      description: Available only when the browser BFF is enabled.
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
          description: Allowed application-relative return path.
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/console/callback:
    get:
      operationId: completeConsoleBrowserLogin
      tags: [Browser authentication]
      summary: Complete the OIDC login callback
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/console/session:
    get:
      operationId: getConsoleBrowserSession
      tags: [Browser authentication]
      summary: Read the current browser session and CSRF token
      security:
        - consoleBrowserSession: []
      responses:
        "200":
          description: Authenticated browser session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSession" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/console/logout:
    post:
      operationId: logoutConsoleBrowserSession
      tags: [Browser authentication]
      summary: Revoke and remove the current browser session
      security:
        - consoleBrowserSession: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: URL that continues provider logout.
          content:
            application/json:
              schema:
                type: object
                required: [logoutUrl]
                properties:
                  logoutUrl: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/console/logout/continue:
    get:
      operationId: continueConsoleBrowserLogout
      tags: [Browser authentication]
      summary: Continue logout at the OIDC provider
      security: []
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/console/logout/provider:
    get:
      operationId: startStandaloneConsoleProviderLogout
      tags: [Browser authentication]
      summary: Start Console provider logout without requiring a session
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/console/logout/callback:
    get:
      operationId: completeConsoleBrowserLogout
      tags: [Browser authentication]
      summary: Complete provider logout and return to the application
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
  /api/v1/auth/admin/login:
    get:
      operationId: startAdminBrowserLogin
      tags: [Browser authentication]
      summary: Start the Admin OIDC authorization-code flow
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
          description: Allowed application-relative return path.
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/admin/callback:
    get:
      operationId: completeAdminBrowserLogin
      tags: [Browser authentication]
      summary: Complete the Admin OIDC login callback
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/admin/session:
    get:
      operationId: getAdminBrowserSession
      tags: [Browser authentication]
      summary: Read the current Admin browser session and CSRF token
      security:
        - adminBrowserSession: []
      responses:
        "200":
          description: Authenticated Admin browser session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserSession" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/admin/logout:
    post:
      operationId: logoutAdminBrowserSession
      tags: [Browser authentication]
      summary: Revoke and remove the current Admin browser session
      security:
        - adminBrowserSession: []
          csrfToken: []
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: URL that continues provider logout.
          content:
            application/json:
              schema:
                type: object
                required: [logoutUrl]
                properties:
                  logoutUrl: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/admin/logout/continue:
    get:
      operationId: continueAdminBrowserLogout
      tags: [Browser authentication]
      summary: Continue Admin logout at the OIDC provider
      security: []
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/admin/logout/provider:
    get:
      operationId: startStandaloneAdminProviderLogout
      tags: [Browser authentication]
      summary: Start Admin provider logout without requiring a session
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        default: { $ref: "#/components/responses/Error" }
  /api/v1/auth/admin/logout/callback:
    get:
      operationId: completeAdminBrowserLogout
      tags: [Browser authentication]
      summary: Complete Admin provider logout and return to the application
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
  /v1/accounts:
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create or return a billing account for an identity
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/CreateAccount" }
      responses:
        "200": { $ref: "#/components/responses/Account" }
        "201": { $ref: "#/components/responses/Account" }
        default: { $ref: "#/components/responses/Error" }
  /v1/accounts/current:
    get:
      operationId: getCurrentAccount
      tags: [Accounts]
      summary: Get the account linked to the caller
      x-required-permissions: [billing:read]
      responses:
        "200": { $ref: "#/components/responses/Account" }
        default: { $ref: "#/components/responses/Error" }
  /v1/accounts/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get a billing account
      x-required-permissions: [billing:read]
      responses:
        "200": { $ref: "#/components/responses/Account" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAccount
      tags: [Accounts]
      summary: Rename a billing account
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/UpdateAccount" }
      responses:
        "200": { $ref: "#/components/responses/AccountSummary" }
        default: { $ref: "#/components/responses/Error" }
  /v1/accounts/{id}/links:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: linkAccount
      tags: [Accounts]
      summary: Link another application identity to an account
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/AccountLink" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/account-links:
    post:
      operationId: linkCurrentAccount
      tags: [Accounts]
      summary: Link another application identity to the caller's account
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/AccountLink" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/accounts/{id}/installations:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: createInstallation
      tags: [Installations]
      summary: Create or reactivate an application installation
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/Installation" }
      responses:
        "201":
          description: Installation created or reactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/products:
    get:
      operationId: listProducts
      tags: [Catalogue]
      summary: List active customer-visible products
      responses:
        "200":
          description: Products.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProduct
      tags: [Catalogue]
      summary: Create a product
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/CreateProduct" }
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Error" }
  /v1/catalog:
    get:
      operationId: getCatalogue
      tags: [Catalogue]
      summary: Get the authoritative customer catalogue
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/ProductFilter" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Versioned product catalogue.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalogue" }
        "304": { $ref: "#/components/responses/NotModified" }
        default: { $ref: "#/components/responses/Error" }
  /v1/plans:
    get:
      operationId: listPlans
      tags: [Catalogue]
      summary: List active plans
      parameters:
        - { $ref: "#/components/parameters/ProductFilter" }
      responses:
        "200":
          description: Plans.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPlan
      tags: [Catalogue]
      summary: Create a plan
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/CreatePlan" }
      responses:
        "201":
          description: Plan created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/plans/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      operationId: updatePlan
      tags: [Catalogue]
      summary: Update a plan
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/UpdatePlan" }
      responses:
        "200":
          description: Plan updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/products:
    get:
      operationId: listAdminProducts
      tags: [Administration, Catalogue]
      summary: List active and archived products
      x-required-permissions: [billing:admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, active, archived], default: all }
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Products visible to an administrator.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminProduct
      tags: [Administration, Catalogue]
      summary: Create a product
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/CreateProduct" }
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/products/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getAdminProduct
      tags: [Administration, Catalogue]
      summary: Get active or archived product detail
      x-required-permissions: [billing:admin]
      responses:
        "200":
          description: Product detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAdminProduct
      tags: [Administration, Catalogue]
      summary: Update, archive, or reactivate a product
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/UpdateProduct" }
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/products/{id}/plans:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listAdminProductPlans
      tags: [Administration, Catalogue]
      summary: List active and inactive plans for a product
      x-required-permissions: [billing:admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, active, inactive], default: all }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Product plans.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Plan" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createAdminProductPlan
      tags: [Administration, Catalogue]
      summary: Create a plan for a product
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/CreateNestedPlan" }
      responses:
        "201":
          description: Plan created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/plans/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getAdminPlan
      tags: [Administration, Catalogue]
      summary: Get active or inactive plan detail
      x-required-permissions: [billing:admin]
      responses:
        "200":
          description: Plan detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAdminPlan
      tags: [Administration, Catalogue]
      summary: Update, archive, or reactivate a plan
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/UpdateAdminPlan" }
      responses:
        "200":
          description: Plan updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/credit-packs:
    get:
      operationId: listCreditPacks
      tags: [Catalogue]
      summary: List active credit packs
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/ProductFilter" }
      responses:
        "200":
          description: Active credit packs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CreditPack" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createCreditPack
      tags: [Catalogue]
      summary: Create a prepaid credit pack
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/CreateCreditPack" }
      responses:
        "201": { $ref: "#/components/responses/IDOnly" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions:
    post:
      operationId: createSubscription
      tags: [Subscriptions]
      summary: Subscribe an account to a plan
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/CreateSubscription" }
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions/current:
    get:
      operationId: getCurrentSubscription
      tags: [Subscriptions]
      summary: Get the caller's current subscription
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/ProductFilter" }
      responses:
        "200":
          description: Current subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions/current/cancellation:
    post:
      operationId: requestCurrentSubscriptionCancellation
      tags: [Subscriptions]
      summary: Cancel the current subscription immediately or at period end
      x-required-permissions: [billing:write]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody: { $ref: "#/components/requestBodies/Cancellation" }
      responses:
        "200":
          description: Cancellation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancellationResult" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/change-plan:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: changeSubscriptionPlan
      tags: [Subscriptions]
      summary: Change a subscription's plan
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/ChangePlan" }
      responses:
        "200": { $ref: "#/components/responses/SubscriptionPlan" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: cancelSubscription
      tags: [Subscriptions]
      summary: Cancel a subscription immediately or at period end
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/SubscriptionStatus" }
      responses:
        "200": { $ref: "#/components/responses/SubscriptionStatus" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions/current/cancel:
    post:
      operationId: cancelCurrentSubscription
      tags: [Subscriptions]
      summary: Immediately cancel the caller's current application subscription
      x-required-permissions: [billing:write]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/reactivate:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: reactivateSubscription
      tags: [Subscriptions]
      summary: Reactivate a subscription
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/SubscriptionStatus" }
      responses:
        "200": { $ref: "#/components/responses/SubscriptionStatus" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscriptions/{id}/renew:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: renewSubscription
      tags: [Subscriptions]
      summary: Renew a subscription idempotently
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/RenewSubscription" }
      responses:
        "200":
          description: Renewal result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Renewal" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscription-transitions:
    post:
      operationId: createSubscriptionTransition
      tags: [Subscriptions]
      summary: Select a plan and let Billmesh determine the required transition
      x-required-permissions: [billing:write]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody: { $ref: "#/components/requestBodies/CreateSubscriptionTransition" }
      responses:
        "201":
          description: Transition created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionTransition" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscription-transitions/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getSubscriptionTransition
      tags: [Subscriptions]
      summary: Get a subscription transition
      x-required-permissions: [billing:read]
      responses:
        "200":
          description: Transition state.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionTransition" }
        default: { $ref: "#/components/responses/Error" }
  /v1/subscription-transitions/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: cancelSubscriptionTransition
      tags: [Subscriptions]
      summary: Cancel a pending subscription transition
      x-required-permissions: [billing:write]
      responses:
        "200":
          description: Cancelled transition.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionTransition" }
        default: { $ref: "#/components/responses/Error" }
  /v1/billing-snapshot:
    get:
      operationId: getBillingSnapshot
      tags: [Billing state]
      summary: Get the authoritative revisioned billing projection
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/ProductFilter" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: Authoritative billing snapshot.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSnapshot" }
        "304": { $ref: "#/components/responses/NotModified" }
        default: { $ref: "#/components/responses/Error" }
  /v1/entitlements:
    get:
      operationId: getEntitlements
      tags: [Entitlements]
      summary: Get the effective entitlements for a product
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/ProductFilter" }
      responses:
        "200":
          description: Subscription status and entitlements.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlements" }
        default: { $ref: "#/components/responses/Error" }
  /v1/entitlements/check:
    get:
      operationId: checkEntitlement
      tags: [Entitlements]
      summary: Check whether a feature is enabled
      x-required-permissions: [billing:read]
      parameters:
        - name: feature
          in: query
          required: true
          schema: { type: string }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/wallets:
    post:
      operationId: createWallet
      tags: [Wallets]
      summary: Create or return an account's product wallet
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/CreateWallet" }
      responses:
        "201": { $ref: "#/components/responses/Wallet" }
        default: { $ref: "#/components/responses/Error" }
  /v1/wallets/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: getWallet
      tags: [Wallets]
      summary: Get wallet balances
      x-required-permissions: [billing:read]
      responses:
        "200": { $ref: "#/components/responses/Wallet" }
        default: { $ref: "#/components/responses/Error" }
  /v1/wallets/{id}/ledger:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      operationId: listWalletLedger
      tags: [Wallets]
      summary: List a wallet's credit ledger
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Ledger entries in creation order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LedgerEntry" }
        default: { $ref: "#/components/responses/Error" }
  /v1/wallets/{id}/grants:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: grantCredits
      tags: [Wallets]
      summary: Grant credits to a wallet idempotently
      x-required-permissions: [credits:grant]
      requestBody: { $ref: "#/components/requestBodies/GrantCredits" }
      responses:
        "200": { $ref: "#/components/responses/Wallet" }
        default: { $ref: "#/components/responses/Error" }
  /v1/wallets/{id}/reservations:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: reserveCredits
      tags: [Reservations]
      summary: Reserve credits for an execution
      description: The tuple `(wallet ID, execution_id, operation_seq)` is idempotent.
      x-required-permissions: [credits:reserve]
      requestBody: { $ref: "#/components/requestBodies/ReserveCredits" }
      responses:
        "201": { $ref: "#/components/responses/Reservation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reservations/{id}/settle:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: settleReservation
      tags: [Reservations]
      summary: Settle a reservation with actual credit usage
      x-required-permissions: [credits:settle]
      requestBody: { $ref: "#/components/requestBodies/Settlement" }
      responses:
        "200": { $ref: "#/components/responses/Reservation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reservations/{id}/release:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: releaseReservation
      tags: [Reservations]
      summary: Release all credits held by a reservation
      x-required-permissions: [credits:settle]
      responses:
        "200": { $ref: "#/components/responses/Reservation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/reservations/{id}/extend:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: extendReservation
      tags: [Reservations]
      summary: Extend a reservation's expiry
      x-required-permissions: [credits:reserve]
      requestBody: { $ref: "#/components/requestBodies/ExtendReservation" }
      responses:
        "200": { $ref: "#/components/responses/Reservation" }
        default: { $ref: "#/components/responses/Error" }
  /v1/executions/authorize:
    post:
      operationId: authorizeExecution
      tags: [Reservations]
      summary: Authorize an execution against an installation or funded wallet
      x-required-permissions: [credits:reserve]
      requestBody: { $ref: "#/components/requestBodies/AuthorizeExecution" }
      responses:
        "201":
          description: Execution authorized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionAuthorization" }
        default: { $ref: "#/components/responses/Error" }
  /v1/installations/{id}/revoke:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: revokeInstallation
      tags: [Installations]
      summary: Revoke an application installation
      x-required-permissions: [billing:write]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/installations/{id}/settle-active:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: settleInstallationExecution
      tags: [Installations]
      summary: Clear and settle an installation's active execution
      x-required-permissions: [credits:settle]
      requestBody: { $ref: "#/components/requestBodies/Settlement" }
      responses:
        "200":
          description: Installation settlement result.
          content:
            application/json:
              schema:
                type: object
                required: [installation_id, settled]
                properties:
                  installation_id: { $ref: "#/components/schemas/UUID" }
                  settled: { type: integer, format: int64, minimum: 0 }
        default: { $ref: "#/components/responses/Error" }
  /v1/usage-events:
    post:
      operationId: recordUsageEvents
      tags: [Usage]
      summary: Record one or more usage events
      description: Accepts a single event, an array, or an object containing an `events` array of at most 1000 items.
      x-required-permissions: [credits:settle]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/UsageEventInput" }
                - type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/UsageEventInput" }
                - type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      minItems: 1
                      maxItems: 1000
                      items: { $ref: "#/components/schemas/UsageEventInput" }
      responses:
        "202":
          description: Usage batch accepted.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, duplicates]
                properties:
                  accepted: { type: integer, minimum: 1 }
                  duplicates: { type: integer, minimum: 0 }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listUsageEvents
      tags: [Usage]
      summary: List usage events for the caller's account
      x-required-permissions: [billing:read]
      parameters:
        - { name: meter, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/ProductFilter" }
        - { name: application, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Usage events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UsageEvent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/limits:
    get:
      operationId: getLimits
      tags: [Usage]
      summary: Get wallet usage and credit limits
      x-required-permissions: [billing:read]
      responses:
        "200":
          description: Wallet limits visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Limit" }
        default: { $ref: "#/components/responses/Error" }
  /v1/payments/orders:
    post:
      operationId: createPaymentOrder
      tags: [Payments]
      summary: Create a payment-provider order for a credit pack
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/CreatePaymentOrder" }
      responses:
        "201":
          description: Payment order created or returned idempotently.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }
        default: { $ref: "#/components/responses/Error" }
  /v1/payments/webhook:
    post:
      operationId: receivePaymentWebhook
      tags: [Payments]
      summary: Receive a signed Razorpay payment event
      security:
        - razorpaySignature: []
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema: { type: string }
          description: Lowercase hexadecimal HMAC-SHA256 of the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentWebhook" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/payments:
    get:
      operationId: listPayments
      tags: [Payments]
      summary: List payments for the caller's account
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Payments, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Payment" }
        default: { $ref: "#/components/responses/Error" }
  /v1/invoices:
    get:
      operationId: listInvoices
      tags: [Payments]
      summary: List invoices for the caller's account
      x-required-permissions: [billing:read]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Invoices, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invoice" }
        default: { $ref: "#/components/responses/Error" }
  /v1/webhooks:
    post:
      operationId: registerWebhook
      tags: [Webhooks]
      summary: Register or replace an application webhook
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/RegisterWebhook" }
      responses:
        "201":
          description: Webhook registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List registered webhooks
      x-required-permissions: [billing:read]
      responses:
        "200":
          description: Registered webhooks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
  /v1/webhooks/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    patch:
      operationId: updateWebhook
      tags: [Webhooks]
      summary: Update or disable a webhook endpoint
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/UpdateWebhook" }
      responses:
        "200":
          description: Updated webhook endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Disable a webhook endpoint
      x-required-permissions: [billing:write]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/webhooks/{id}/rotate-secret:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Rotate a webhook signing secret
      x-required-permissions: [billing:write]
      requestBody: { $ref: "#/components/requestBodies/RotateWebhookSecret" }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/adjustments:
    post:
      operationId: createAdminAdjustment
      tags: [Administration]
      summary: Grant an audited administrative credit adjustment
      x-required-permissions: [billing:admin]
      requestBody: { $ref: "#/components/requestBodies/AdminAdjustment" }
      responses:
        "201":
          description: Adjustment created.
          content:
            application/json:
              schema:
                type: object
                required: [operation_ref]
                properties:
                  operation_ref: { type: string }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/audit:
    get:
      operationId: listAuditEvents
      tags: [Administration]
      summary: List account audit events
      x-required-permissions: [billing:admin]
      parameters:
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Audit events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/webhooks/{id}/replay:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      operationId: replayWebhookDelivery
      tags: [Administration, Webhooks]
      summary: Queue a webhook delivery for replay
      x-required-permissions: [billing:admin]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        default: { $ref: "#/components/responses/Error" }
  /v1/events:
    get:
      operationId: streamEvents
      tags: [Events]
      summary: Stream account events using Server-Sent Events
      description: |
        Replays events after `Last-Event-ID`, then streams new events. A cursor
        that has fallen out of retained history returns `410`. Each account may
        hold at most eight concurrent streams.
      x-required-permissions: [billing:read]
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
                example: "id: 42\nevent: credits.granted\ndata: {\"amount\":100}\n\n"
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token carrying Billmesh permissions and application context.
    consoleBrowserSession:
      type: apiKey
      in: cookie
      name: __Host-billmesh-console-session
      description: Opaque Console session cookie owned by the Billmesh API origin.
    adminBrowserSession:
      type: apiKey
      in: cookie
      name: __Host-billmesh-admin-session
      description: Opaque Admin session cookie owned by the Billmesh API origin.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with the browser session cookie for unsafe BFF requests.
    razorpaySignature:
      type: apiKey
      in: header
      name: X-Razorpay-Signature
      description: HMAC-SHA256 signature supplied by Razorpay.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    ProductFilter:
      name: product
      in: query
      schema: { type: string }
      description: Product slug. Defaults to the caller's application where applicable.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
      description: Client-generated key scoped to the authenticated account and product.
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string }
      description: Optional billing snapshot ETag used for optimistic concurrency.
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
      description: Previously observed resource ETag.
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
  headers:
    ETag:
      description: Revision-backed entity tag.
      schema: { type: string }
  responses:
    Health:
      description: Process is healthy.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, const: ok }
    Readiness:
      description: API and database are ready.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, const: ready }
    Error:
      description: Request failed. The HTTP status communicates the failure category.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Redirect:
      description: Empty response redirecting to the identity provider or browser application.
      headers:
        Location:
          schema: { type: string, format: uri-reference }
    NoContent:
      description: Operation completed successfully with no response body.
    NotModified:
      description: The supplied entity tag is current.
    Account:
      description: Billing account.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Account" }
    AccountSummary:
      description: Updated billing account.
      content:
        application/json:
          schema:
            type: object
            required: [id, name]
            properties:
              id: { $ref: "#/components/schemas/UUID" }
              name: { type: string }
    IDOnly:
      description: Resource identifier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/IDOnly" }
    IDWithSlug:
      description: Resource identifier and slug.
      content:
        application/json:
          schema:
            type: object
            required: [id, slug]
            properties:
              id: { $ref: "#/components/schemas/UUID" }
              slug: { type: string }
    Wallet:
      description: Wallet balances.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Wallet" }
    Reservation:
      description: Credit reservation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Reservation" }
    SubscriptionPlan:
      description: Subscription plan changed.
      content:
        application/json:
          schema:
            type: object
            required: [id, plan_id]
            properties:
              id: { $ref: "#/components/schemas/UUID" }
              plan_id: { $ref: "#/components/schemas/UUID" }
    SubscriptionStatus:
      description: Subscription status changed.
      content:
        application/json:
          schema:
            type: object
            required: [id, status, scheduled]
            properties:
              id: { $ref: "#/components/schemas/UUID" }
              status: { type: string }
              scheduled: { type: boolean }
  requestBodies:
    CreateAccount:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name, application, organization_id]
            properties:
              name: { type: string, minLength: 1 }
              external_ref: { type: string }
              application: { type: string, minLength: 1 }
              organization_id: { type: string, minLength: 1 }
    UpdateAccount:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, minLength: 1 }
    AccountLink:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [application, organization_id]
            properties:
              application: { type: string, minLength: 1 }
              organization_id: { type: string, minLength: 1 }
              environment: { type: string, default: production }
    Installation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [application, organization_id]
            properties:
              application: { type: string, minLength: 1 }
              organization_id: { type: string, minLength: 1 }
    CreateProduct:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [slug, name]
            properties:
              slug: { type: string, minLength: 2, maxLength: 63, pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$" }
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
              entitlement_schema: { $ref: "#/components/schemas/EntitlementSchema" }
    UpdateProduct:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
              entitlement_schema: { $ref: "#/components/schemas/EntitlementSchema" }
              active: { type: boolean }
              version: { type: integer, format: int64, minimum: 1 }
    CreatePlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [product_id, slug, name]
            properties:
              product_id: { $ref: "#/components/schemas/UUID" }
              slug: { type: string, minLength: 2, maxLength: 63, pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$" }
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
              currency: { type: string, pattern: "^[A-Z]{3}$", default: INR }
              billing_interval: { type: string, enum: [monthly, annual], default: monthly }
              billing_model: { type: string, enum: [free, paid] }
              price_minor: { type: integer, format: int64, minimum: 0 }
              included_credits: { type: integer, format: int64, minimum: 0 }
              entitlements: { type: object, additionalProperties: true }
              entitlement_schema_version: { type: integer, format: int64, minimum: 1 }
              active: { type: boolean, default: true }
              selectable: { type: boolean, default: true }
              default_for_product: { type: boolean, default: false }
              checkout_enabled: { type: boolean, default: true }
              effective_from: { type: string, format: date-time }
              effective_to: { type: [string, "null"], format: date-time }
    CreateNestedPlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [slug, name]
            properties:
              slug: { type: string, minLength: 2, maxLength: 63, pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$" }
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
              currency: { type: string, pattern: "^[A-Z]{3}$", default: INR }
              billing_interval: { type: string, enum: [monthly, annual], default: monthly }
              billing_model: { type: string, enum: [free, paid] }
              price_minor: { type: integer, format: int64, minimum: 0 }
              included_credits: { type: integer, format: int64, minimum: 0 }
              entitlements: { type: object, additionalProperties: true }
              entitlement_schema_version: { type: integer, format: int64, minimum: 1 }
              active: { type: boolean, default: true }
              selectable: { type: boolean, default: true }
              default_for_product: { type: boolean, default: false }
              checkout_enabled: { type: boolean, default: true }
              effective_from: { type: string, format: date-time }
              effective_to: { type: [string, "null"], format: date-time }
    UpdatePlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
              price_minor: { type: integer, format: int64, minimum: 0 }
              currency: { type: string, pattern: "^[A-Z]{3}$" }
              included_credits: { type: integer, format: int64, minimum: 0 }
              entitlements: { type: object, additionalProperties: true }
              entitlement_schema_version: { type: integer, format: int64, minimum: 1 }
              billing_interval: { type: string, enum: [monthly, annual] }
              billing_model: { type: string, enum: [free, paid] }
              active: { type: boolean }
              selectable: { type: boolean }
              default_for_product: { type: boolean }
              checkout_enabled: { type: boolean }
              effective_from: { type: string, format: date-time }
              effective_to: { type: [string, "null"], format: date-time }
              version: { type: integer, format: int64, minimum: 1 }
    UpdateAdminPlan:
      required: true
