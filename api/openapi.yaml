        id: { $ref: "#/components/schemas/UUID" }
        subscription_id: { type: [string, "null"], format: uuid }
        plan_id: { $ref: "#/components/schemas/UUID" }
        plan_family_id: { type: string }
        plan_name: { type: string }
        operation: { type: string, enum: [activate, upgrade, downgrade, change, reactivate, renew] }
        effective: { type: string, enum: [immediate, period_end] }
        effective_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [requires_payment, processing, completed, failed, expired, cancelled] }
        billing_policy_version: { type: integer, format: int64, minimum: 1 }
        failure_code: { type: [string, "null"] }
        payment_id: { type: [string, "null"], format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        snapshot_url: { type: string, format: uri-reference }
        checkout:
          oneOf:
            - { $ref: "#/components/schemas/Checkout" }
            - { type: "null" }
    Checkout:
      type: object
      additionalProperties: false
      required: [provider, presentation, checkout_url, client_config, expires_at, success_url, cancel_url]
      properties:
        provider: { type: string, const: razorpay }
        presentation: { type: string, enum: [inline, modal, provider_hosted] }
        checkout_url: { type: [string, "null"], format: uri }
        client_config:
          oneOf:
            - { $ref: "#/components/schemas/CheckoutClientConfig" }
            - { type: "null" }
        expires_at: { type: [string, "null"], format: date-time }
        success_url: { type: [string, "null"], format: uri }
        cancel_url: { type: [string, "null"], format: uri }
    CheckoutClientConfig:
      type: object
      additionalProperties: false
      required: [public_key, order_id, amount_minor, currency]
      properties:
        public_key: { type: string, minLength: 1, description: Public provider key; never a provider secret. }
        order_id: { type: string, minLength: 1 }
        amount_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    CancellationResult:
      type: object
      required: [id, status, cancel_at_period_end, revision, duplicate]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status: { type: string }
        cancel_at_period_end: { type: boolean }
        effective_at: { type: [string, "null"], format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
        duplicate: { type: boolean }
    BillingSnapshot:
      type: object
      additionalProperties: false
      required: [revision, generated_at, effective_at, verified_at, expires_at, degraded_until, product_policy, account, subscription, entitlements, credit_balance, resource_limits, pending_transition]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        generated_at: { type: string, format: date-time }
        effective_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        degraded_until: { type: [string, "null"], format: date-time }
        product_policy:
          type: object
          additionalProperties: false
          required: [version, policy]
          properties:
            version: { type: integer, format: int64, minimum: 1 }
            policy: { $ref: "#/components/schemas/BillingPolicy" }
        account:
          $ref: "#/components/schemas/BillingSnapshotAccount"
        subscription:
          oneOf:
            - { $ref: "#/components/schemas/BillingSnapshotSubscription" }
            - { type: "null" }
        entitlements: { $ref: "#/components/schemas/EntitlementValues" }
        credit_balance:
          oneOf:
            - { $ref: "#/components/schemas/BillingSnapshotCreditBalance" }
            - { type: "null" }
        resource_limits:
          type: array
          items: { $ref: "#/components/schemas/BillingSnapshotResourceLimit" }
        pending_transition:
          oneOf:
            - { $ref: "#/components/schemas/BillingSnapshotPendingTransition" }
            - { type: "null" }
    BillingSnapshotAccount:
      type: object
      additionalProperties: false
      required: [id, customer_id, name]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        customer_id: { type: [string, "null"], format: uuid }
        name: { type: string }
    BillingSnapshotSubscription:
      type: object
      additionalProperties: false
      required: [id, status, current_period_start, current_period_end, cancel_at_period_end, billing_policy, billing_policy_version, effective_plan]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [pending, active, past_due, cancelled, expired] }
        current_period_start: { type: [string, "null"], format: date-time }
        current_period_end: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
        billing_policy: { $ref: "#/components/schemas/BillingPolicy" }
        billing_policy_version: { type: integer, format: int64, minimum: 1 }
        effective_plan: { $ref: "#/components/schemas/BillingSnapshotEffectivePlan" }
    BillingSnapshotEffectivePlan:
      type: object
      additionalProperties: false
      required: [id, plan_family_id, version, name, description, billing_model, price_minor, currency, billing_interval, included_credits, entitlement_schema_version, entitlement_schema, entitlements]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        plan_family_id: { type: string }
        version: { type: integer, format: int64, minimum: 1 }
        name: { type: string }
        description: { type: string }
        billing_model: { type: string, enum: [free, paid] }
        price_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        billing_interval: { type: string, enum: [monthly, annual] }
        included_credits: { type: integer, format: int64, minimum: 0 }
        entitlement_schema_version: { type: integer, format: int64, minimum: 1 }
        entitlement_schema: { $ref: "#/components/schemas/EntitlementSchema" }
        entitlements: { $ref: "#/components/schemas/EntitlementValues" }
    BillingSnapshotCreditBalance:
      type: object
      additionalProperties: false
      required: [wallet_id, available, reserved, total_granted]
      properties:
        wallet_id: { $ref: "#/components/schemas/UUID" }
        available: { type: integer, format: int64, minimum: 0 }
        reserved: { type: integer, format: int64, minimum: 0 }
        total_granted: { type: integer, format: int64, minimum: 0 }
    BillingSnapshotResourceLimit:
      type: object
      additionalProperties: false
      required: [key, resource, unit, enforcement, value]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        resource: { type: string, minLength: 1, maxLength: 128 }
        unit: { type: string, maxLength: 64 }
        enforcement: { type: string, const: limit }
        value:
          oneOf:
            - { type: integer }
            - { type: number }
    BillingSnapshotPendingTransition:
      type: object
      additionalProperties: false
      required: [id, target_plan_id, plan_family_id, status, operation, effective, effective_at, checkout_expires_at, billing_policy_version]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        target_plan_id: { $ref: "#/components/schemas/UUID" }
        plan_family_id: { type: string }
        status: { type: string, enum: [requires_payment, processing] }
        operation: { type: string, enum: [activate, upgrade, downgrade, change, reactivate, renew] }
        effective: { type: string, enum: [immediate, period_end] }
        effective_at: { type: [string, "null"], format: date-time }
        checkout_expires_at: { type: [string, "null"], format: date-time }
        billing_policy_version: { type: integer, format: int64, minimum: 1 }
    EntitlementValues:
      type: object
      additionalProperties: { $ref: "#/components/schemas/EntitlementValue" }
    EntitlementValue:
      oneOf:
        - { type: boolean }
        - { type: integer }
        - { type: number }
        - { type: string }
        - type: array
          items: {}
        - type: object
          additionalProperties: true
        - { type: "null" }
    Entitlements:
      type: object
      required: [status, entitlements]
      properties:
        status: { type: string }
        entitlements: { $ref: "#/components/schemas/EntitlementValues" }
    Wallet:
      type: object
      description: Wallet service values currently use Go's exported field names in JSON.
      required: [ID, AccountID, ProductID, Available, Reserved, CreatedAt]
      properties:
        ID: { $ref: "#/components/schemas/UUID" }
        AccountID: { $ref: "#/components/schemas/UUID" }
        ProductID: { $ref: "#/components/schemas/UUID" }
        Available: { type: integer, format: int64 }
        Reserved: { type: integer, format: int64 }
        CreatedAt: { type: string, format: date-time }
    Reservation:
      type: object
      description: Reservation service values currently use Go's exported field names in JSON.
      required: [ID, WalletID, ExecutionID, OperationSeq, Requested, Status, ExpiresAt]
      properties:
        ID: { $ref: "#/components/schemas/UUID" }
        WalletID: { $ref: "#/components/schemas/UUID" }
        ExecutionID: { type: string }
        OperationSeq: { type: integer }
        Requested: { type: integer, format: int64 }
        Settled: { type: [integer, "null"], format: int64 }
        Status: { type: string, enum: [reserved, settled, released, expired] }
        ExpiresAt: { type: string, format: date-time }
    LedgerEntry:
      type: object
      required: [id, operation_ref, kind, available_delta, reserved_delta, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        operation_ref: { type: string }
        kind: { type: string }
        available_delta: { type: integer, format: int64 }
        reserved_delta: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Installation:
      type: object
      required: [id, account_id, application, organization_id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        application: { type: string }
        organization_id: { type: string }
    ExecutionAuthorization:
      type: object
      required: [authorized]
      properties:
        authorized: { type: boolean, const: true }
        installation_id: { $ref: "#/components/schemas/UUID" }
        execution_id: { type: string }
        wallet_id: { $ref: "#/components/schemas/UUID" }
        reservation: { $ref: "#/components/schemas/Reservation" }
    UsageEventInput:
      type: object
      required: [event_id, reservation_id, meter]
      properties:
        event_id: { type: string, minLength: 1 }
        reservation_id: { $ref: "#/components/schemas/UUID" }
        meter:
          type: string
          enum: [workflow.execution, llm.input_tokens, llm.output_tokens, agent.runtime_ms, compute.milliseconds]
        application: { type: string }
        quantity: { type: integer, format: int64, minimum: 0 }
        units: { type: integer, format: int64, minimum: 0, deprecated: true }
        occurred_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
    UsageEvent:
      type: object
      required: [event_id, meter, quantity, application, product, occurred_at]
      properties:
        event_id: { type: string }
        meter: { type: string }
        quantity: { type: integer, format: int64 }
        application: { type: string }
        product: { type: string }
        occurred_at: { type: string, format: date-time }
    Limit:
      type: object
      required: [wallet_id, product, available, reserved, total_granted, usage_percent]
      properties:
        wallet_id: { $ref: "#/components/schemas/UUID" }
        product: { type: string }
        available: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        total_granted: { type: integer, format: int64 }
        usage_percent: { type: integer, minimum: 0, maximum: 100 }
    PaymentOrder:
      type: object
      additionalProperties: false
      required: [payment_id, credit_pack_id, credits, checkout]
      properties:
        payment_id: { $ref: "#/components/schemas/UUID" }
        credit_pack_id: { $ref: "#/components/schemas/UUID" }
        credits: { type: integer, format: int64 }
        checkout: { $ref: "#/components/schemas/Checkout" }
    PaymentWebhook:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [payment.captured, order.paid, payment.failed, refund.processed] }
        payment_id: { type: string }
        order_id: { type: string }
        status: { type: string }
        refund_id: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        payload: { type: object, additionalProperties: true }
    Payment:
      type: object
      required: [id, provider, status, amount_minor, currency, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        provider: { type: string }
        provider_order_id: { type: [string, "null"] }
        provider_payment_id: { type: [string, "null"] }
        status: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        created_at: { type: string, format: date-time }
    PaymentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        next_cursor: { type: [string, "null"] }
    Invoice:
      type: object
      required: [id, invoice_number, status, currency, total_minor, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        invoice_number: { type: string }
        status: { type: string }
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        finalized_at: { type: [string, "null"], format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    InvoicePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        next_cursor: { type: [string, "null"] }
    Webhook:
      type: object
      required: [id, application, target_url, active, api_version, event_types]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        application: { type: string }
        target_url: { type: string, format: uri }
        active: { type: boolean }
        api_version: { type: string, const: "2" }
        event_types:
          type: array
          items: { $ref: "#/components/schemas/WebhookEventType" }
        created_at: { type: string, format: date-time }
    WebhookEventType:
      type: string
      enum:
        - billing.ownership_transferred
        - credits.expired
        - credits.granted
        - payment.failed
        - payment.late_capture
        - payment.refunded
        - payment.succeeded
        - subscription.cancelled
        - subscription.cancellation_scheduled
        - subscription.cancellation_withdrawn
        - subscription.expired
        - subscription.past_due
        - subscription.renewed
        - subscription.transition_completed
    BillmeshWebhookEventV2:
      type: object
      additionalProperties: false
      required: [specversion, schema_version, id, type, occurred_at, account_id, product_id, revision, aggregate, snapshot_url, data]
      properties:
        specversion: { type: string, const: "1.0" }
        schema_version: { type: string, const: "2" }
        id: { $ref: "#/components/schemas/UUID" }
        type: { $ref: "#/components/schemas/WebhookEventType" }
        occurred_at: { type: string, format: date-time }
        account_id: { type: [string, "null"], format: uuid }
        product_id: { type: [string, "null"], format: uuid }
        revision: { type: [integer, "null"], format: int64, minimum: 1 }
        aggregate:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type: { type: string, enum: [account, subscription, payment, wallet] }
            id: { $ref: "#/components/schemas/UUID" }
        snapshot_url: { type: string, const: /v1/billing-snapshot }
        data: { $ref: "#/components/schemas/BillmeshWebhookDataV2" }
    BillmeshWebhookDataV2:
      type: object
      additionalProperties: false
      description: Event-specific diagnostic data. Consumers reconcile from snapshot_url rather than applying this object as state.
      properties:
        subscription_id: { type: string, format: uuid }
        transition_id: { type: string, format: uuid }
        payment_id: { type: string, format: uuid }
        refund_id: { type: string, format: uuid }
        grant_id: { type: string, format: uuid }
        transfer_id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        amount: { type: integer, format: int64 }
        amount_minor: { type: integer, format: int64 }
        credits: { type: integer, format: int64 }
        credits_reversed: { type: integer, format: int64 }
        source: { type: string }
        reason: { type: string }
        effective: { type: string }
        operation: { type: string }
        deferred: { type: boolean }
        full: { type: boolean }
        refund_policy: { type: string }
        entitlement_policy: { type: string }
        expiration_policy: { type: string }
        policy_version: { type: integer, format: int64, minimum: 1 }
        current_period_end: { type: string, format: date-time }
        grace_period_end: { type: string, format: date-time }
        snapshot_url: { type: string, const: /v1/billing-snapshot }
    AuditEvent:
      type: object
      required: [id, actor, actor_type, action, resource_type, resource_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        actor: { type: string }
        actor_type: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
