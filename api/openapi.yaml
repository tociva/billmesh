    RegisterWebhook:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [target_url, secret]
            properties:
              target_url: { type: string, format: uri }
              secret: { type: string, minLength: 32, writeOnly: true }
              api_version: { type: string, const: "2", default: "2" }
              event_types:
                type: array
                uniqueItems: true
                items: { $ref: "#/components/schemas/WebhookEventType" }
    UpdateWebhook:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              target_url: { type: string, format: uri }
              active: { type: boolean }
              api_version: { type: string, const: "2" }
              event_types:
                type: array
                uniqueItems: true
                items: { $ref: "#/components/schemas/WebhookEventType" }
    RotateWebhookSecret:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [secret]
            properties:
              secret: { type: string, minLength: 32, writeOnly: true }
              grace_seconds: { type: integer, format: int64, minimum: 0, maximum: 604800, default: 86400 }
    AdminAdjustment:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [wallet_id, amount, reason]
            properties:
              wallet_id: { $ref: "#/components/schemas/UUID" }
              amount: { type: integer, format: int64, minimum: 1 }
              reason: { type: string, minLength: 1 }
  schemas:
    UUID:
      type: string
      format: uuid
    Error:
      type: object
      additionalProperties: false
      required: [error, code, request_id]
      properties:
        error: { type: string }
        code: { type: string, description: Stable machine-readable reason code. }
        request_id: { type: string, description: Request correlation identifier returned in X-Request-ID. }
    IDOnly:
      type: object
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
    Account:
      type: object
      required: [id, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        external_ref: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OwnershipTransfer:
      type: object
      additionalProperties: false
      required: [id, status, decision_code, required_action, base_revision, expires_at, confirmed_at, cancelled_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status:
          type: string
          enum: [authorized, requires_paid_transition, ineligible, confirmed, cancelled, expired]
        decision_code:
          type: string
          enum: [owner_eligible, new_owner_free_allowance_exhausted]
        required_action: { type: string, enum: [none, paid_transition, reject] }
        base_revision: { type: integer, format: int64, minimum: 1 }
        expires_at: { type: string, format: date-time }
        confirmed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
    BrowserSession:
      type: object
      required: [authenticated, user, context, csrfToken, expiresAt]
      properties:
        authenticated: { type: boolean, const: true }
        user:
          type: object
          required: [subject, email, name]
          properties:
            subject: { type: string }
            email: { type: string }
            name: { type: string }
        context:
          type: object
          required: [organization_id, application, environment]
          properties:
            organization_id: { type: string }
            application: { type: string }
            environment: { type: string }
        csrfToken: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
    EntitlementOption:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        value: { type: string, minLength: 1 }
    EntitlementField:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        type: { type: string, enum: [boolean, integer, number, string, select, object, array] }
        unit: { type: string, maxLength: 64 }
        enforcement: { type: string, enum: [feature, limit, meter] }
        resource: { type: string, maxLength: 128 }
        required: { type: boolean, default: false }
        nullable: { type: boolean, default: false }
        default: {}
        minimum: { type: number }
        maximum: { type: number }
        min_length: { type: integer, minimum: 0 }
        max_length: { type: integer, minimum: 0 }
        min_items: { type: integer, minimum: 0 }
        max_items: { type: integer, minimum: 0 }
        options:
          type: array
          items: { $ref: "#/components/schemas/EntitlementOption" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/EntitlementField" }
        items: { $ref: "#/components/schemas/EntitlementField" }
    EntitlementSchema:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EntitlementField" }
    BillingPolicy:
      type: object
      additionalProperties: false
      required: [schema_version, customer, onboarding, catalogue, lifecycle, projection, checkout]
      properties:
        schema_version: { type: integer, const: 1 }
        customer:
          type: object
          additionalProperties: false
          required: [scope, free_allowance, ownership_change, ownership_transfer, ineligible_owner_action]
          properties:
            scope: { type: string, enum: [identity, organization, external_customer] }
            free_allowance: { type: integer, minimum: 0, maximum: 1000000 }
            ownership_change: { type: string, enum: [retain, reevaluate] }
            ownership_transfer: { type: string, enum: [unsupported, retain, preauthorized_recheck] }
            ineligible_owner_action: { type: string, enum: [reject, require_paid_checkout] }
        onboarding:
          type: object
          additionalProperties: false
          required: [allow_without_subscription, initial_plan, ineligible_action, deletion_retention]
          properties:
            allow_without_subscription: { type: boolean }
            initial_plan: { type: string, enum: [automatic_default, explicit_transition] }
            ineligible_action: { type: string, enum: [reject, restricted, require_paid_checkout] }
            deletion_retention: { type: string, enum: [retain, anonymize] }
        catalogue:
          type: object
          additionalProperties: false
          required: [access, required_before_account, presentation_fields, trial_enabled, trial_days, trial_conversion]
          properties:
            access: { type: string, enum: [public, application_token] }
            required_before_account: { type: boolean }
            presentation_fields:
              type: array
              uniqueItems: true
              items: { type: string, enum: [description, price, entitlements, availability, effective_dates] }
            trial_enabled: { type: boolean }
            trial_days: { type: integer, minimum: 0, maximum: 3650 }
            trial_conversion: { type: string, enum: [expire, require_checkout, automatic_mandate] }
        lifecycle:
          type: object
          additionalProperties: false
          required: [free_to_paid, paid_to_paid, downgrade, cancellation_default, allow_immediate_cancel, immediate_cancel_refund, allow_cancellation_withdraw, reactivation, over_limit, renewal, grace_period_days, dunning, expiration, refund_entitlements, chargeback_entitlements]
          properties:
            free_to_paid: { type: string, const: immediate_after_capture }
            paid_to_paid: { type: string, enum: [checkout, mandate_proration, period_end] }
            downgrade: { type: string, const: period_end }
            cancellation_default: { type: string, enum: [period_end, immediate] }
            allow_immediate_cancel: { type: boolean }
            immediate_cancel_refund: { type: string, enum: [none, prorated, full] }
            allow_cancellation_withdraw: { type: boolean }
            reactivation: { type: string, enum: [resume, new_transition] }
            over_limit: { type: string, enum: [block_new, grace_period, reject_transition] }
            renewal: { type: string, enum: [provider_event, manual] }
            grace_period_days: { type: integer, minimum: 0, maximum: 365 }
            dunning: { type: string, enum: [none, grace_period] }
            expiration: { type: string, enum: [cancel, downgrade_to_default] }
            refund_entitlements: { type: string, enum: [retain, revoke] }
            chargeback_entitlements: { type: string, enum: [retain, revoke] }
        projection:
          type: object
          additionalProperties: false
          required: [fresh_seconds, degraded_seconds, fail_closed_operations, refresh_seconds, reconciliation_seconds]
          properties:
            fresh_seconds: { type: integer, minimum: 0, maximum: 2592000 }
            degraded_seconds: { type: integer, minimum: 0, maximum: 2592000 }
            fail_closed_operations:
              type: array
              uniqueItems: true
              items: { type: string, enum: [account_create, subscription_change, credit_purchase, resource_create, limit_increase] }
            refresh_seconds: { type: integer, minimum: 1, maximum: 2592000 }
            reconciliation_seconds: { type: integer, minimum: 1, maximum: 2592000 }
        checkout:
          type: object
          additionalProperties: false
          required: [allowed_redirect_origins, presentation, recurring_mandate, confirmation]
          properties:
            allowed_redirect_origins:
              type: array
              maxItems: 50
              uniqueItems: true
              items: { type: string, format: uri }
            presentation: { type: string, enum: [inline, modal, provider_hosted] }
            recurring_mandate: { type: boolean }
            confirmation: { type: string, enum: [webhook, poll_and_webhook] }
    BillingPolicyMetadata:
      type: object
      required: [schema_version, defaults, options, constraints]
      properties:
        schema_version: { type: integer, const: 1 }
        defaults: { $ref: "#/components/schemas/BillingPolicy" }
        options:
          type: object
