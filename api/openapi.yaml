        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [version]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
              price_minor: { type: integer, format: int64, minimum: 0 }
              currency: { type: string, pattern: "^[A-Z]{3}$" }
              included_credits: { type: integer, format: int64, minimum: 0 }
              entitlements: { type: object, additionalProperties: true }
              entitlement_schema_version: { type: integer, format: int64, minimum: 1 }
              billing_interval: { type: string, enum: [monthly, annual] }
              billing_model: { type: string, enum: [free, paid] }
              active: { type: boolean }
              selectable: { type: boolean }
              default_for_product: { type: boolean }
              checkout_enabled: { type: boolean }
              effective_from: { type: string, format: date-time }
              effective_to: { type: [string, "null"], format: date-time }
              version: { type: integer, format: int64, minimum: 1 }
    CreateCreditPack:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [product_id, slug, name, credits, price_minor]
            properties:
              product_id: { $ref: "#/components/schemas/UUID" }
              slug: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
              currency: { type: string, default: INR }
              credits: { type: integer, format: int64, minimum: 1 }
              price_minor: { type: integer, format: int64, minimum: 0 }
              validity_days: { type: integer, minimum: 1 }
    CreateSubscription:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              account_id: { $ref: "#/components/schemas/UUID" }
              plan_id: { $ref: "#/components/schemas/UUID" }
              product: { type: string }
              plan: { type: string }
              payment_status: { type: string, enum: [verified] }
            anyOf:
              - required: [plan_id]
              - required: [plan]
    ChangePlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              plan_id: { $ref: "#/components/schemas/UUID" }
              plan: { type: string }
              effective: { type: string }
              payment_status: { type: string }
            anyOf:
              - required: [plan_id]
              - required: [plan]
    SubscriptionStatus:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              immediate: { type: boolean, default: true }
    RenewSubscription:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              operation_ref: { type: string, description: Idempotency reference required for paid renewals. }
              payment_status: { type: string, enum: [verified] }
    CreateSubscriptionTransition:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [plan_id]
            properties:
              plan_id: { $ref: "#/components/schemas/UUID" }
              effective: { type: string, enum: [immediate, period_end] }
    Cancellation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              effective: { type: string, enum: [immediate, period_end], default: period_end }
    CreateWallet:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [account_id, product_id]
            properties:
              account_id: { $ref: "#/components/schemas/UUID" }
              product_id: { $ref: "#/components/schemas/UUID" }
    GrantCredits:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [source, operation_ref, amount]
            properties:
              source: { type: string }
              operation_ref: { type: string, minLength: 1 }
              amount: { type: integer, format: int64, minimum: 1 }
              expires_at: { type: [string, "null"], format: date-time }
    ReserveCredits:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [execution_id, amount]
            properties:
              execution_id: { type: string, minLength: 1 }
              operation_seq: { type: integer }
              amount: { type: integer, format: int64, minimum: 1 }
              ttl_seconds: { type: integer, minimum: 1, default: 900 }
    Settlement:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [actual]
            properties:
              actual: { type: integer, format: int64, minimum: 0 }
    ExtendReservation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [ttl_seconds]
            properties:
              ttl_seconds: { type: integer, minimum: 1 }
    AuthorizeExecution:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [credits]
            properties:
              context: { type: string, description: Product context; `standalone` maps to `taskmesh`. }
              installation_id: { type: string, format: uuid }
              wallet_id: { type: string, format: uuid, deprecated: true }
              execution_id: { type: string }
              credits: { type: integer, format: int64, minimum: 1 }
              operation_seq: { type: integer }
              ttl_seconds: { type: integer, minimum: 1, default: 900 }
    CreatePaymentOrder:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            anyOf:
              - required: [credit_pack_id]
              - required: [credit_pack]
            properties:
              account_id: { $ref: "#/components/schemas/UUID" }
              credit_pack_id: { $ref: "#/components/schemas/UUID" }
              credit_pack: { type: string, minLength: 1 }
              price_minor: { type: integer, format: int64, minimum: 0, description: Optional assertion; the server controls the price. }
              idempotency_key: { type: string, format: uuid, description: Existing internal payment ID to return. }
    RegisterWebhook:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [application, target_url, secret]
            properties:
              application: { type: string, minLength: 1 }
              target_url: { type: string, format: uri }
              secret: { type: string, minLength: 1, writeOnly: true }
              previous_secret: { type: string, minLength: 1, writeOnly: true, description: Optional former secret accepted during a 24-hour migration window. }
              api_version: { type: string, enum: ["1", "2"], default: "1" }
              event_types:
                type: array
                uniqueItems: true
                items: { type: string }
    UpdateWebhook:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              target_url: { type: string, format: uri }
              active: { type: boolean }
              api_version: { type: string, enum: ["1", "2"] }
              event_types:
                type: array
                uniqueItems: true
                items: { type: string }
    RotateWebhookSecret:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [secret]
            properties:
              secret: { type: string, minLength: 16, writeOnly: true }
              grace_seconds: { type: integer, format: int64, minimum: 0, maximum: 604800, default: 86400 }
    AdminAdjustment:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [wallet_id, amount, reason]
            properties:
              wallet_id: { $ref: "#/components/schemas/UUID" }
              amount: { type: integer, format: int64, minimum: 1 }
              reason: { type: string, minLength: 1 }
  schemas:
    UUID:
      type: string
      format: uuid
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    IDOnly:
      type: object
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
    Account:
      type: object
      required: [id, name, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        external_ref: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BrowserSession:
      type: object
      required: [authenticated, user, context, permissions, csrfToken, expiresAt]
      properties:
        authenticated: { type: boolean, const: true }
        user:
          type: object
          required: [subject, email, name]
          properties:
            subject: { type: string }
            email: { type: string }
            name: { type: string }
        context:
          type: object
          required: [organization_id, application, environment]
          properties:
            organization_id: { type: string }
            application: { type: string }
            environment: { type: string }
        permissions:
          type: array
          items: { type: string }
        csrfToken: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
    EntitlementOption:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        value: { type: string, minLength: 1 }
    EntitlementField:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{0,62}$" }
        label: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }
        type: { type: string, enum: [boolean, integer, number, string, select, object, array] }
        required: { type: boolean, default: false }
        nullable: { type: boolean, default: false }
        default: {}
        minimum: { type: number }
        maximum: { type: number }
        min_length: { type: integer, minimum: 0 }
        max_length: { type: integer, minimum: 0 }
        min_items: { type: integer, minimum: 0 }
        max_items: { type: integer, minimum: 0 }
        options:
          type: array
          items: { $ref: "#/components/schemas/EntitlementOption" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/EntitlementField" }
        items: { $ref: "#/components/schemas/EntitlementField" }
    EntitlementSchema:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EntitlementField" }
    Product:
      type: object
      required: [id, slug, name, description, entitlement_schema, entitlement_schema_version, active, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        entitlement_schema: { $ref: "#/components/schemas/EntitlementSchema" }
        entitlement_schema_version: { type: integer, format: int64, minimum: 1 }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Plan:
      type: object
      required: [id, product_id, slug, name, description, price_minor, currency, included_credits, entitlements, billing_interval, billing_model, product, selectable, default_for_product, checkout_enabled, effective_from, active, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        product_id: { $ref: "#/components/schemas/UUID" }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        price_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string }
        included_credits: { type: integer, format: int64, minimum: 0 }
        entitlements: { type: object, additionalProperties: true }
        billing_interval: { type: string, enum: [monthly, annual] }
        billing_model: { type: string, enum: [free, paid] }
        product: { type: string }
        selectable: { type: boolean }
        default_for_product: { type: boolean }
        checkout_enabled: { type: boolean }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, "null"], format: date-time }
        active: { type: boolean }
        version: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreditPack:
      type: object
      required: [id, name, credits, price_minor, currency]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        credits: { type: integer, format: int64, minimum: 1 }
        price_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string }
        validity_days: { type: [integer, "null"], minimum: 1 }
    CataloguePlan:
      type: object
      required: [id, name, description, price_minor, currency, included_credits, entitlements, billing_interval, billing_model, selectable, default_for_product, checkout_enabled, effective_from, version]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        price_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string }
        included_credits: { type: integer, format: int64, minimum: 0 }
        entitlements: { type: object, additionalProperties: true }
        billing_interval: { type: string, enum: [monthly, annual] }
        billing_model: { type: string, enum: [free, paid] }
        selectable: { type: boolean, const: true }
        default_for_product: { type: boolean }
        checkout_enabled: { type: boolean }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
    Catalogue:
      type: object
      required: [product, revision, plans, credit_packs]
      properties:
        product:
          type: object
          required: [id, slug, name, description]
          properties:
            id: { $ref: "#/components/schemas/UUID" }
            slug: { type: string }
            name: { type: string }
            description: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        plans:
          type: array
          items: { $ref: "#/components/schemas/CataloguePlan" }
        credit_packs:
          type: array
          items: { $ref: "#/components/schemas/CreditPack" }
    Subscription:
      type: object
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        plan_id: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [pending, active, past_due, cancelled, expired] }
        current_period_start: { type: [string, "null"], format: date-time }
        current_period_end: { type: [string, "null"], format: date-time }
        cancel_at_period_end: { type: boolean }
    SubscriptionTransition:
      type: object
      required: [id, plan_id, plan_name, operation, effective, status, revision, snapshot_url]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        subscription_id: { type: [string, "null"], format: uuid }
        plan_id: { $ref: "#/components/schemas/UUID" }
        plan_name: { type: string }
        operation: { type: string, enum: [activate, upgrade, downgrade, change, reactivate, renew] }
        effective: { type: string, enum: [immediate, period_end] }
        effective_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [requires_payment, processing, completed, failed, expired, cancelled] }
        failure_code: { type: [string, "null"] }
        payment_id: { type: [string, "null"], format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        snapshot_url: { type: string, format: uri-reference }
        checkout:
          type: object
          required: [provider, order_id, amount_minor, currency]
          properties:
            provider: { type: string, const: razorpay }
            order_id: { type: [string, "null"] }
            amount_minor: { type: integer, format: int64, minimum: 0 }
            currency: { type: string }
            expires_at: { type: [string, "null"], format: date-time }
    CancellationResult:
      type: object
      required: [id, status, cancel_at_period_end, revision, duplicate]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status: { type: string }
        cancel_at_period_end: { type: boolean }
        effective_at: { type: [string, "null"], format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
        duplicate: { type: boolean }
    BillingSnapshot:
      type: object
      required: [revision, generated_at, effective_at, verified_at, expires_at, account, entitlements]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        generated_at: { type: string, format: date-time }
        effective_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        account:
          type: object
          required: [id, name]
          properties:
            id: { $ref: "#/components/schemas/UUID" }
            customer_id: { type: [string, "null"], format: uuid }
            name: { type: string }
        subscription:
          type: [object, "null"]
          additionalProperties: true
        entitlements: { type: object, additionalProperties: true }
        limits:
          type: [object, "null"]
          additionalProperties: true
        pending_transition:
          type: [object, "null"]
          additionalProperties: true
    Renewal:
      type: object
      required: [id, status, current_period_end, duplicate]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        status: { type: string, const: active }
        current_period_end: { type: string, format: date-time }
        duplicate: { type: boolean }
    Entitlements:
      type: object
      required: [status, entitlements]
      properties:
        status: { type: string }
        entitlements: { type: object, additionalProperties: true }
    Wallet:
      type: object
      description: Wallet service values currently use Go's exported field names in JSON.
      required: [ID, AccountID, ProductID, Available, Reserved, CreatedAt]
      properties:
        ID: { $ref: "#/components/schemas/UUID" }
        AccountID: { $ref: "#/components/schemas/UUID" }
        ProductID: { $ref: "#/components/schemas/UUID" }
        Available: { type: integer, format: int64 }
        Reserved: { type: integer, format: int64 }
        CreatedAt: { type: string, format: date-time }
    Reservation:
      type: object
      description: Reservation service values currently use Go's exported field names in JSON.
      required: [ID, WalletID, ExecutionID, OperationSeq, Requested, Status, ExpiresAt]
      properties:
        ID: { $ref: "#/components/schemas/UUID" }
        WalletID: { $ref: "#/components/schemas/UUID" }
        ExecutionID: { type: string }
        OperationSeq: { type: integer }
        Requested: { type: integer, format: int64 }
        Settled: { type: [integer, "null"], format: int64 }
        Status: { type: string, enum: [reserved, settled, released, expired] }
        ExpiresAt: { type: string, format: date-time }
    LedgerEntry:
      type: object
      required: [id, operation_ref, kind, available_delta, reserved_delta, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        operation_ref: { type: string }
        kind: { type: string }
        available_delta: { type: integer, format: int64 }
        reserved_delta: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    Installation:
      type: object
      required: [id, account_id, application, organization_id]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        account_id: { $ref: "#/components/schemas/UUID" }
        application: { type: string }
        organization_id: { type: string }
    ExecutionAuthorization:
      type: object
      required: [authorized]
      properties:
        authorized: { type: boolean, const: true }
        installation_id: { $ref: "#/components/schemas/UUID" }
        execution_id: { type: string }
        wallet_id: { $ref: "#/components/schemas/UUID" }
        reservation: { $ref: "#/components/schemas/Reservation" }
    UsageEventInput:
      type: object
      required: [event_id, reservation_id, meter]
      properties:
        event_id: { type: string, minLength: 1 }
        reservation_id: { $ref: "#/components/schemas/UUID" }
        meter:
          type: string
          enum: [workflow.execution, llm.input_tokens, llm.output_tokens, agent.runtime_ms, compute.milliseconds]
        application: { type: string }
        quantity: { type: integer, format: int64, minimum: 0 }
        units: { type: integer, format: int64, minimum: 0, deprecated: true }
        occurred_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
    UsageEvent:
      type: object
      required: [event_id, meter, quantity, application, product, occurred_at]
      properties:
        event_id: { type: string }
        meter: { type: string }
        quantity: { type: integer, format: int64 }
        application: { type: string }
        product: { type: string }
        occurred_at: { type: string, format: date-time }
    Limit:
      type: object
      required: [wallet_id, product, available, reserved, total_granted, usage_percent]
      properties:
        wallet_id: { $ref: "#/components/schemas/UUID" }
        product: { type: string }
        available: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        total_granted: { type: integer, format: int64 }
        usage_percent: { type: integer, minimum: 0, maximum: 100 }
    PaymentOrder:
      type: object
      required: [payment_id, provider, order, credit_pack, credits]
      properties:
        payment_id: { $ref: "#/components/schemas/UUID" }
        provider: { type: string, const: razorpay }
        order:
          type: object
          additionalProperties: true
          properties:
            id: { type: string }
            status: { type: string }
            amount: { type: integer, format: int64 }
            currency: { type: string }
        credit_pack: { type: string }
        credits: { type: integer, format: int64 }
    PaymentWebhook:
      type: object
      required: [id, type]
      properties:
        id: { type: string }
        type: { type: string, enum: [payment.captured, payment.failed, refund.processed] }
        payment_id: { type: string }
        order_id: { type: string }
        status: { type: string }
        refund_id: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        payload: { type: object, additionalProperties: true }
    Payment:
      type: object
      required: [id, provider, status, amount_minor, currency, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        provider: { type: string }
        provider_order_id: { type: [string, "null"] }
        provider_payment_id: { type: [string, "null"] }
        status: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        created_at: { type: string, format: date-time }
    Invoice:
      type: object
      required: [id, invoice_number, status, currency, total_minor, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        invoice_number: { type: string }
        status: { type: string }
        currency: { type: string }
        total_minor: { type: integer, format: int64 }
        finalized_at: { type: [string, "null"], format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    Webhook:
      type: object
      required: [id, application, target_url, active, api_version, event_types]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        application: { type: string }
        target_url: { type: string, format: uri }
        active: { type: boolean }
        api_version: { type: string, enum: ["1", "2"] }
        event_types:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, actor, actor_type, action, resource_type, resource_id, created_at]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        actor: { type: string }
        actor_type: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
