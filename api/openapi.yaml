              installation_id: { type: string, format: uuid }
              wallet_id: { type: string, format: uuid, deprecated: true }
              execution_id: { type: string }
              credits: { type: integer, format: int64, minimum: 1 }
              operation_seq: { type: integer }
              ttl_seconds: { type: integer, minimum: 1, default: 900 }
    CreatePaymentOrder:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
